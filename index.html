<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D/3D Copy Paste စာရင်းချုပ်</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 550px;
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 5px;
        }
        p.subtitle {
            font-size: 13px;
            color: #666;
            margin-bottom: 15px;
            text-align: center;
        }
        textarea {
            width: 100%;
            height: 160px;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            resize: vertical;
            transition: border-color 0.3s;
        }
        textarea:focus {
            border-color: #3498db;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            margin-bottom: 20px;
        }
        button {
            flex: 1;
            padding: 12px;
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #27ae60;
        }
        .reset-btn {
            background-color: #e74c3c;
        }
        .reset-btn:hover {
            background-color: #c0392b;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #eee;
        }
        th {
            background-color: #34495e;
            color: white;
            border-radius: 4px;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .total-summary {
            margin-top: 20px;
            padding: 15px;
            background-color: #e8f4f8;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            color: #2c3e50;
            font-size: 18px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>2D / 3D စာရင်းချုပ် Calculator</h2>
    <p class="subtitle">ဥပမာ- 321R100 (၆ ကွက်ခွဲမည်) ၊ 78-71-73 R500 (၂ လုံး အလှည့်) ၊ 321 100</p>
    
    <textarea id="pasteArea" placeholder="ဒီနေရာမှာ Copy Paste လုပ်ပါ...&#10;321R100&#10;78-71-73 R500&#10;08-01-03 R500"></textarea>

    <div class="btn-group">
        <button onclick="processData()">စာရင်းတွက်မည်</button>
        <button class="reset-btn" onclick="resetData()">ဖျက်မည်</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>ဂဏန်း</th>
                <th>ထိုးသူ ဦးရေ</th>
                <th>စုစုပေါင်း ပမာဏ</th>
            </tr>
        </thead>
        <tbody id="listTable">
            <!-- စာရင်းများ ဒီနေရာမှာ ပေါ်လာမည် -->
        </tbody>
    </table>

    <div class="total-summary">
        <span>စုစုပေါင်း ရငွေ:</span>
        <span id="grandTotal">0 ကျပ်</span>
    </div>
</div>

<script>
    let bets = {};

    function addBet(num, amount) {
        if (num.length === 1) num = '0' + num;

        if (bets[num]) {
            bets[num].amount += amount;
            bets[num].count += 1;
        } else {
            bets[num] = {
                amount: amount,
                count: 1
            };
        }
    }

    // ဂဏန်း၏ ပတ်လည် အလှည့်အကွက်များ အားလုံးကို ထုတ်ပေးသည့် function (Permutations)
    function getPermutations(str) {
        if (str.length <= 1) return [str];
        let permutations = [];
        for (let i = 0; i < str.length; i++) {
            let char = str[i];
            let remaining = str.slice(0, i) + str.slice(i + 1);
            for (let sub of getPermutations(remaining)) {
                permutations.push(char + sub);
            }
        }
        // ထပ်နေသော ဂဏန်းများကို ဖယ်ထုတ်ရန် (ဥပမာ- 112 ဆိုရင် ၃ ကွက်ပဲ ထွက်မည်)
        return [...new Set(permutations)];
    }

    function processData() {
        const text = document.getElementById('pasteArea').value;
        if (!text.trim()) return;

        const lines = text.split('\n');

        lines.forEach(line => {
            let trimmed = line.trim();
            if (!trimmed) return;

            // ၁။ R ပါဝင်သော ပုံစံများ (ဥပမာ- 321R100, 78-71-73 R500)
            let rMatch = trimmed.match(/^(.*?)\s*[Rr]\s*(\d+)$/);

            if (rMatch) {
                let numsText = rMatch[1];
                let amount = parseInt(rMatch[2]);

                let numbers = numsText.match(/\d+/g);
                if (numbers) {
                    numbers.forEach(num => {
                        // ဂဏန်း၏ အလှည့်ပတ်လည် အကွက်များ အားလုံးကို ယူမည်
                        let permutedList = getPermutations(num);
                        permutedList.forEach(pNum => {
                            addBet(pNum, amount);
                        });
                    });
                }
            } else {
                // ၂။ R မပါဘဲ =, -, : သို့မဟုတ် Space ဖြင့် ပမာဏခွဲထားသော ပုံစံများ (ဥပမာ- 321 100, 22-100)
                let eqMatch = trimmed.match(/^(.*?)\s*[:=\-\s]\s*(\d+)$/);

                if (eqMatch) {
                    let numsText = eqMatch[1].trim();
                    let amount = parseInt(eqMatch[2]);

                    let numbers = numsText.match(/\d+/g);
                    if (numbers) {
                        numbers.forEach(num => {
                            addBet(num, amount);
                        });
                    }
                }
            }
        });

        document.getElementById('pasteArea').value = '';
        renderTable();
    }

    function renderTable() {
        const tableBody = document.getElementById('listTable');
        const grandTotalSpan = document.getElementById('grandTotal');
        tableBody.innerHTML = '';

        let totalSum = 0;

        for (let num in bets) {
            totalSum += bets[num].amount;

            let row = `<tr>
                <td><strong>${num}</strong></td>
                <td>${bets[num].count} ယောက်</td>
                <td>${bets[num].amount.toLocaleString()} ကျပ်</td>
            </tr>`;
            tableBody.innerHTML += row;
        }

        grandTotalSpan.innerText = totalSum.toLocaleString() + ' ကျပ်';
    }

    function resetData() {
        if (confirm('စာရင်းအားလုံးကို ဖျက်ရန် သေချာပါသလား။')) {
            bets = {};
            document.getElementById('pasteArea').value = '';
            renderTable();
        }
    }
</script>

</body>
</html>
